<style>
:root{--bg:#f3f4f8;--sf:#fff;--ink:#0b1b3a;--mu:#5d667a;--ac:#ffc53d;--ln:#e3e6ee;--ok:#13783a;--bad:#b42318;--hero:#0b1b3a;--inp:#f3f4f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1020;--sf:#141b30;--ink:#eef1f8;--mu:#9aa3b8;--ln:#252f4b;--ok:#4cc27a;--bad:#ff8a7a;--hero:#1c2a5a;--inp:#0b1020}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1020;--sf:#141b30;--ink:#eef1f8;--mu:#9aa3b8;--ln:#252f4b;--ok:#4cc27a;--bad:#ff8a7a;--hero:#1c2a5a;--inp:#0b1020}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
button,input{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.w{max-width:40rem;margin:0 auto;padding:1rem 1rem 7rem}
